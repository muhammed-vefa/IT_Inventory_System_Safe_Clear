<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYDATA Kocaeli - Sistem Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="login-required">
    <div id="login-overlay" class="modal-backdrop">
        <div class="card" style="max-width: 400px; width: 90%; text-align: center;">
            <div class="logo mb-4">
                <img src="/logo/KOCSH.png" alt="SYS KOCAELISH" style="width: 200px; margin: 0 auto 20px;">
            </div>
            <input type="text" id="login-user" class="search-bar" placeholder="Kullanıcı Adı">
            <input type="password" id="login-pass" class="search-bar" placeholder="Şifre">
            <button class="btn btn-accent" style="width: 100%;" onclick="app.handleLoginButtonClick()">Giriş Yap</button>
        </div>
    </div>

    <nav>
        <div class="logo" onclick="app.navigateTo('dashboard')" style="cursor:pointer">
            <img src="/logo/KOCSH.png" alt="SYS KOCAELISH" style="width: 200px;">
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link active" data-view="dashboard">Dashboard</a>
            <a href="#" class="nav-link" data-view="inventory">Envanter</a>
            <a href="#" class="nav-link" data-view="general-notes">Bilgi Bankası</a>
            <a href="#" class="nav-link" data-view="areas">Ortak Alanlar</a>
            <a href="#" class="nav-link" data-view="printers">Yazıcılar</a>
            <a href="#" class="nav-link" data-view="depot">Depo</a>
            <a href="#" class="nav-link" data-view="docs">Tutanaklar</a>
        </div>
        <div class="flex-row">
            <div class="custom-dropdown" id="shortcuts-dropdown">
                <button class="btn btn-secondary" onclick="app.toggleDropdown('shortcuts-dropdown')">Kısayollar <i class="fas fa-chevron-down"></i></button>
                <div class="dropdown-menu">
                    <a href="http://bim.kocaelish.com/" target="_blank"><i class="fas fa-server"></i> BIM</a>
                    <a href="https://hbys.kocaelish.com/" target="_blank"><i class="fas fa-hospital"></i> HBYS</a>
                </div>
            </div>
            <div class="flex-row" style="margin-left:15px">
                <span id="active-user-name" style="margin-right:10px">Giriş Yapılmadı</span>
                <i class="fas fa-circle-user fa-xl" onclick="app.toggleDropdown('profile-dropdown')" style="color: var(--accent); cursor:pointer"></i>
                <div class="custom-dropdown" id="profile-dropdown">
                    <div class="dropdown-menu" style="right:0; left:auto">
                        <a href="#" onclick="app.handleLogout()"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Dashboard View -->
        <section id="view-dashboard" class="view">
            <h2 class="section-title">IT Varlık Analizi</h2>
            <div class="grid" style="grid-template-columns: 1fr 1fr;">
                <div class="card" style="text-align:center"><h3>Bilgisayar Dağılımı</h3><canvas id="dashboard-pie-chart"></canvas></div>
                <div class="card" style="text-align:center"><h3>KeyOS Durum</h3><canvas id="dashboard-keyos-chart"></canvas></div>
            </div>
            <div class="stats-row">
                <div class="stat-card"><span class="stat-value" id="stat-os-windows">0</span><span class="stat-label">Windows</span></div>
                <div class="stat-card"><span class="stat-value" id="stat-os-keyos">0</span><span class="stat-label">KeyOS</span></div>
                <div class="stat-card"><span class="stat-value" id="stat-pc-sahada">0</span><span class="stat-label">Sahada</span></div>
            </div>
        </section>

        <!-- Inventory View -->
        <section id="view-inventory" class="view" style="display:none">
            <div class="flex-between mb-4">
                <h2 class="section-title">Cihaz Envanteri</h2>
                <input type="text" id="main-search" class="search-bar" style="max-width:300px" placeholder="Ara..." oninput="app.loadInventory()">
            </div>
            <div id="inventory-grid" class="grid"></div>
        </section>

        <section id="view-general-notes" class="view" style="display:none"><h2>Bilgi Bankası</h2></section>
        <section id="view-areas" class="view" style="display:none"><h2>Ortak Alanlar</h2></section>
        <section id="view-printers" class="view" style="display:none"><h2>Yazıcılar</h2></section>
        <section id="view-depot" class="view" style="display:none"><h2>Depo</h2></section>
        <section id="view-docs" class="view" style="display:none"><h2>Tutanaklar</h2></section>
    </main>

    <script src="/frontend/UI_controller.js"></script>
</body>
</html>
